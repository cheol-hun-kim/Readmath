<svg width="600" height="320" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="320" fill="#ffffff"/>
  <rect x="20" y="20" width="560" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="65" font-family="'Pretendard', sans-serif" font-size="20" font-weight="bold" fill="#1e293b">[문제 12]</text>
  <text x="45" y="115" font-family="'Pretendard', sans-serif" font-size="18" fill="#334155">닫힌구간 [0, 2]에서 이차함수</text>
  <text x="45" y="160" font-family="'Pretendard', sans-serif" font-size="22" font-weight="bold" fill="#2563eb">f(x) = -x² + 2ax + 1</text>
  <text x="45" y="205" font-family="'Pretendard', sans-serif" font-size="18" fill="#334155">의 최댓값이 5일 때, 양수 a의 값을 구하시오.</text>
  <text x="45" y="260" font-family="'Pretendard', sans-serif" font-size="14" fill="#64748b">(단, a는 상수이다.)</text>
</svg>
