services:
  # ReadMath Web Client (Static Site on Render.com)
  - type: web
    name: readmath
    runtime: static
    buildCommand: echo "ReadMath static web ready"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /assets/*
        destination: /assets/*
      - type: rewrite
        source: /sw.js
        destination: /sw.js
      - type: rewrite
        source: /manifest.json
        destination: /manifest.json
      - type: rewrite
        source: /icon-*.png
        destination: /icon-*.png
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /landing
        destination: /landing.html
      - type: rewrite
        source: /pricing
        destination: /landing.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /*
        destination: /index.html
