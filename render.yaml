services:
  - type: web
    name: readmath-web
    env: static
    buildCommand: node sync_public.js
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: "0"
    routes:
      - type: rewrite
        source: /landing
        destination: /landing.html
      - type: rewrite
        source: /admin
        destination: /admin.html
